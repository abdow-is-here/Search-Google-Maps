<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Maps Best Rating Finder</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">📍</span>
        <span class="brand-name">Best Rating Finder</span>
      </div>
      <h2 class="sidebar-title">Recent searches</h2>
      <ul id="recent-list" class="recent-list">
        <li class="empty-hint">Your last 5 searches will show up here.</li>
      </ul>
    </aside>

    <main class="container">
      <h1>Google Maps Best Rating Finder</h1>
      <p class="subtitle">Search any city and get the top-rated places, ranked by rating and review count.</p>

      <div class="category-bar" id="category-grid">
        <button type="button" class="cat-chip" data-term="restaurants">🍽️ Restaurants</button>
        <button type="button" class="cat-chip" data-term="hotels">🏨 Hotels</button>
        <button type="button" class="cat-chip" data-term="car rental">🚗 Car Rentals</button>
        <button type="button" class="cat-chip" data-term="gyms">🏋️ Gyms</button>
        <button type="button" class="cat-chip" data-term="libraries">📚 Libraries</button>
        <button type="button" class="cat-chip" data-term="parks">🌳 Parks &amp; Gardens</button>
        <button type="button" class="cat-chip" data-term="beauty salons">💇 Beauty Salons</button>
        <button type="button" class="cat-chip" data-term="dry cleaning">👔 Dry Cleaning</button>
        <button type="button" class="cat-chip" data-term="hospitals">🏥 Hospitals</button>
        <button type="button" class="cat-chip" data-term="schools">🏫 Schools</button>
        <button type="button" class="cat-chip" data-term="malls">🛍️ Malls</button>
        <button type="button" class="cat-chip" data-term="mosques">🕌 Mosques</button>
        <button type="button" class="cat-chip" data-term="grocery stores">🛒 Groceries</button>
      </div>

      <p id="location-badge" class="location-badge"></p>

      <form id="search-form">
        <input type="text" id="query" placeholder="e.g. restaurants in Riyadh" required>

        <div class="mode-toggle" role="radiogroup" aria-label="Search mode">
          <label class="mode-option">
            <input type="radio" name="mode" value="auto" checked>
            <span>Best rankings</span>
          </label>
          <label class="mode-option">
            <input type="radio" name="mode" value="custom">
            <span>Custom filters</span>
          </label>
        </div>
        <p id="mode-hint" class="mode-hint">Shows the top 10 results for your search, sorted by number of reviews (rating breaks ties).</p>

        <div class="options" id="custom-options" hidden>
          <label>
            Min. rating
            <input type="number" id="min_rating" value="3" min="0" max="5" step="0.1" autocomplete="off">
          </label>
          <label>
            Min. reviews
            <input type="number" id="min_reviews" value="20" min="0">
          </label>
          <label>
            Results
            <input type="number" id="top" value="10" min="1" max="20">
          </label>
        </div>

        <div class="options" id="location-options" hidden>
          <label>
            Country
            <select id="country-select">
              <option value="">Any</option>
            </select>
          </label>
          <label>
            City
            <input type="text" id="city-input" list="city-datalist" placeholder="e.g. Riyadh" autocomplete="off">
            <datalist id="city-datalist"></datalist>
          </label>
        </div>

        <button type="submit">Search</button>
      </form>

      <div id="status"></div>
      <div id="results"></div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='countries.js') }}"></script>
  <script>
    const form = document.getElementById('search-form');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const recentListEl = document.getElementById('recent-list');
    const queryInput = document.getElementById('query');
    const locationBadgeEl = document.getElementById('location-badge');
    const countrySelectEl = document.getElementById('country-select');
    const cityInputEl = document.getElementById('city-input');
    const cityDatalistEl = document.getElementById('city-datalist');

    const RECENT_KEY = 'gmbrf_recent_searches';

    const customOptionsEl = document.getElementById('custom-options');
    const locationOptionsEl = document.getElementById('location-options');
    const modeHintEl = document.getElementById('mode-hint');

    // Detected (or manually chosen) current location
    let currentCity = '';
    let currentCountryName = '';
    let currentCountryCode = '';

    // --- Country dropdown setup ---
    COUNTRIES.forEach(([code, name]) => {
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = name;
      opt.dataset.name = name;
      countrySelectEl.appendChild(opt);
    });

    function selectedCountryName() {
      const opt = countrySelectEl.selectedOptions[0];
      return opt ? (opt.dataset.name || '') : '';
    }

    // --- Mode toggle ---
    function getMode() {
      return document.querySelector('input[name="mode"]:checked').value;
    }

    function applyMode() {
      const isCustom = getMode() === 'custom';
      customOptionsEl.hidden = !isCustom;
      locationOptionsEl.hidden = !isCustom;
      modeHintEl.textContent = isCustom
        ? 'Only shows places that meet the minimum rating and review count you set, in the country/city you pick.'
        : 'Shows the top 10 results for your search in your current city, sorted by number of reviews (rating breaks ties).';
    }

    document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', applyMode));
    applyMode();

    // --- Location detection ---
    function updateLocationBadge() {
      if (currentCity) {
        locationBadgeEl.textContent = `📍 Searching near: ${currentCity}${currentCountryName ? ', ' + currentCountryName : ''}`;
      } else {
        locationBadgeEl.textContent = '';
      }
    }

    // A promise the search handler waits on, so a category click can never fire
    // before the browser has actually resolved (or given up on) the location.
    let resolveLocationReady;
    const locationReady = new Promise(resolve => { resolveLocationReady = resolve; });

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude } = pos.coords;
          try {
            const res = await fetch(`/api/reverse-geocode?lat=${latitude}&lng=${longitude}`);
            const data = await res.json();
            if (res.ok) {
              currentCity = data.city || '';
              currentCountryName = data.country || '';
              currentCountryCode = data.country_code || '';
              if (currentCountryCode) countrySelectEl.value = currentCountryCode;
              if (currentCity) cityInputEl.value = currentCity;
              updateLocationBadge();
            }
          } catch { /* silently proceed without auto-location */ }
          resolveLocationReady();
        },
        () => { resolveLocationReady(); }  // permission denied or unavailable; app still works, just no auto-city
      );
      setTimeout(resolveLocationReady, 4000);  // safety net if geolocation hangs
    } else {
      resolveLocationReady();
    }

    // --- City autocomplete (as-you-type, scoped to selected country) ---
    let cityDebounce;
    cityInputEl.addEventListener('input', () => {
      clearTimeout(cityDebounce);
      const value = cityInputEl.value.trim();
      if (value.length < 2) return;
      cityDebounce = setTimeout(async () => {
        try {
          const res = await fetch(`/api/cities?input=${encodeURIComponent(value)}&country_code=${countrySelectEl.value}`);
          const data = await res.json();
          cityDatalistEl.innerHTML = '';
          (data.cities || []).forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            cityDatalistEl.appendChild(opt);
          });
        } catch { /* ignore, autocomplete is a convenience feature */ }
      }, 300);
    });

    // --- Recent searches (per-browser) ---
    function getRecent() {
      try {
        return JSON.parse(localStorage.getItem(RECENT_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveRecent(query) {
      let recent = getRecent().filter(q => q.toLowerCase() !== query.toLowerCase());
      recent.unshift(query);
      recent = recent.slice(0, 5);
      localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
      renderRecent();
    }

    function renderRecent() {
      const recent = getRecent();
      recentListEl.innerHTML = '';
      if (recent.length === 0) {
        recentListEl.innerHTML = '<li class="empty-hint">Your last 5 searches will show up here.</li>';
        return;
      }
      recent.forEach(q => {
        const li = document.createElement('li');
        li.className = 'recent-item';
        li.textContent = q;
        li.addEventListener('click', () => {
          queryInput.value = q;
          form.requestSubmit();
        });
        recentListEl.appendChild(li);
      });
    }

    renderRecent();

    // --- Category shortcut buttons ---
    document.querySelectorAll('.cat-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        queryInput.value = btn.dataset.term;
        form.requestSubmit();
      });
    });

    // --- Search submit ---
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = queryInput.value.trim();
      const mode = getMode();

      if (mode === 'auto' && !currentCity) {
        statusEl.textContent = 'Detecting your location...';
        await locationReady;
      }

      let url = `/api/search?query=${encodeURIComponent(query)}&mode=${mode}`;

      if (mode === 'custom') {
        const minRating = document.getElementById('min_rating').value;
        const minReviews = document.getElementById('min_reviews').value;
        const top = document.getElementById('top').value;
        url += `&min_rating=${minRating}&min_reviews=${minReviews}&top=${top}`;

        const city = cityInputEl.value.trim();
        const country = selectedCountryName();
        if (city) url += `&city=${encodeURIComponent(city)}`;
        if (country) url += `&country=${encodeURIComponent(country)}`;
      } else if (currentCity) {
        url += `&city=${encodeURIComponent(currentCity)}`;
        if (currentCountryName) url += `&country=${encodeURIComponent(currentCountryName)}`;
      }

      resultsEl.innerHTML = '';
      statusEl.textContent = 'Searching...';

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!res.ok) {
          statusEl.textContent = data.error || 'Something went wrong.';
          return;
        }

        saveRecent(query);

        if (data.results.length === 0) {
          statusEl.textContent = mode === 'custom'
            ? 'No places met your rating/review filters. Try loosening them.'
            : 'No rated places found for this search. Try a different search term.';
          return;
        }

        statusEl.textContent = '';
        data.results.forEach((r, i) => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = r.maps_url;
          card.target = '_blank';
          card.rel = 'noopener';
          card.innerHTML = `
            <div class="rank">${i + 1}</div>
            <div class="info">
              <div class="name">${r.name}</div>
              <div class="meta">⭐ ${r.rating} · ${r.reviews.toLocaleString()} reviews</div>
              <div class="address">${r.address || ''}</div>
            </div>
          `;
          resultsEl.appendChild(card);
        });
      } catch (err) {
        statusEl.textContent = 'Network error. Please try again.';
      }
    });
  </script>
</body>
</html>
